<!doctype html><html><head><meta charset="utf-8">
<!-- GaugeWorks v2 mockups (2026-11-08). Open v2.html?t=premium|classic&p=daily|towing|economy|trend
     Original designs: references were used for feel only, no logos, names or copied artwork. -->
<style>
@font-face{font-family:B4;src:url(../../gaugeworks/themes/oem/fonts/Barlow-Regular.ttf)}
@font-face{font-family:B5;src:url(../../gaugeworks/themes/oem/fonts/Barlow-Medium.ttf)}
@font-face{font-family:B6;src:url(../../gaugeworks/themes/oem/fonts/Barlow-SemiBold.ttf)}
@font-face{font-family:C5;src:url(../../gaugeworks/themes/oem/fonts/BarlowSemiCondensed-Medium.ttf)}
@font-face{font-family:C6;src:url(../../gaugeworks/themes/oem/fonts/BarlowSemiCondensed-SemiBold.ttf)}
html,body{margin:0;background:#000}svg{display:block}
</style></head><body>
<svg id="s" width="1024" height="600" viewBox="0 0 1024 600" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const q=new URLSearchParams(location.search),TH=q.get('t')||'premium',PG=q.get('p')||'daily';
const V={rpm:1650,mph:65,gear:'6',boost:8.0,cool:190,trans:171,oil:205,egt:842,fuel:.70,volt:14.2,out:90,
  inst:16.9,iat:92,tank:15.5,trip:15.1,last10:16.5,tripmi:32.5,odo:113304,range:282,vgt:48};
const PAL={premium:{bg0:'#0c1624',bg1:'#03060b',text:'#eef3f8',dim:'#8796a8',faint:'#2a3a4f',acc:'#4fb0ff',acc2:'#1c5ea8',red:'#ff3b30',amber:'#ffb340',green:'#38d97a'},
           classic:{bg0:'#17181b',bg1:'#060607',text:'#f4f1e6',dim:'#9fae9f',faint:'#2f3a31',acc:'#ff7a1a',acc2:'#b8460a',red:'#ff3324',amber:'#ffb000',green:'#4dff7a',tick:'#4dff7a'}};
const C=PAL[TH];
const rad=d=>d*Math.PI/180,P=(cx,cy,r,a)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))],n1=v=>(+v).toFixed(1);
const arc=(cx,cy,r,a,b)=>{const[x0,y0]=P(cx,cy,r,a),[x1,y1]=P(cx,cy,r,b);return `M${n1(x0)},${n1(y0)} A${r},${r} 0 ${Math.abs(b-a)>180?1:0} ${b>a?1:0} ${n1(x1)},${n1(y1)}`};
const T=(x,y,s,t,o={})=>(s>=54&&!o.nb?Tx(x,y,s,t,{...o,blur:1}):'')+Tx(x,y,s,t,o);
const Tx=(x,y,s,t,o={})=>`<text${o.blur?' filter="url(#bloom)" opacity=".5"':''} x="${n1(x)}" y="${n1(y)}" font-family="${o.f||'B6'}" font-size="${s}" fill="${o.c||C.text}" text-anchor="${o.a||'middle'}"${o.ls?` letter-spacing="${o.ls}"`:''}${o.op&&!o.blur?` opacity="${o.op}"`:''}${o.db?` dominant-baseline="${o.db}"`:''}>${t}</text>`;
const fmt=n=>n.toLocaleString('en-US');
let s='';
// ---------- shared defs
s+=`<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="${C.bg0}"/><stop offset="1" stop-color="${C.bg1}"/></radialGradient>
<radialGradient id="face" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="${TH=='premium'?'#101c2c':'#16161a'}"/><stop offset="1" stop-color="${TH=='premium'?'#04070c':'#030304'}"/></radialGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset=".22" stop-color="#7d8692"/><stop offset=".45" stop-color="#e3e7ec"/><stop offset=".7" stop-color="#3c434c"/><stop offset="1" stop-color="#c9ced6"/></linearGradient>
<linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".5" stop-color="#5b636e"/><stop offset="1" stop-color="#c4c9d0"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${C.acc2}"/><stop offset="1" stop-color="${C.acc}"/></linearGradient>
<linearGradient id="blueV" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${C.acc2}"/><stop offset="1" stop-color="${C.acc}"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16263a" stop-opacity=".9"/><stop offset="1" stop-color="#070c14" stop-opacity=".95"/></linearGradient>
<radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset=".6" stop-color="${C.red}" stop-opacity="0"/><stop offset="1" stop-color="${C.red}" stop-opacity=".75"/></radialGradient>
<filter id="bloom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="bloomBig" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="dshadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".75"/></filter>
<filter id="nshadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="5" dy="7" stdDeviation="3.5" flood-color="#000" flood-opacity=".7"/></filter>
<radialGradient id="vign" cx="50%" cy="48%" r="78%"><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
<linearGradient id="glassG" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".17"/><stop offset=".42" stop-color="#fff" stop-opacity=".035"/><stop offset=".43" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="faceIn" cx="50%" cy="50%" r="50%"><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
<linearGradient id="bevelHi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".48" stop-color="#fff" stop-opacity=".025"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="recess" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset=".22" stop-color="#000" stop-opacity="0"/></linearGradient>
<pattern id="brushed" width="600" height="4" patternUnits="userSpaceOnUse"><rect y="1" width="600" height="1" fill="#fff" fill-opacity=".028"/><rect y="3" width="600" height="1" fill="#000" fill-opacity=".25"/></pattern>
<linearGradient id="cw1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0d11"/><stop offset=".5" stop-color="#262c36"/><stop offset="1" stop-color="#0b0d11"/></linearGradient>
<linearGradient id="cw2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090b0e"/><stop offset=".5" stop-color="#1c2129"/><stop offset="1" stop-color="#090b0e"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset=".2" stop-color="#bfe6ff" stop-opacity="0"/><stop offset=".5" stop-color="#bfe6ff" stop-opacity=".10"/><stop offset=".8" stop-color="#bfe6ff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
<radialGradient id="hub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#9aa2ad"/><stop offset=".5" stop-color="#2b2f35"/><stop offset="1" stop-color="#08090a"/></radialGradient>
<pattern id="carbon" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#07090c"/><rect width="6" height="6" fill="url(#cw1)"/><rect x="6" y="6" width="6" height="6" fill="url(#cw1)"/><rect x="6" width="6" height="6" fill="url(#cw2)"/><rect y="6" width="6" height="6" fill="url(#cw2)"/></pattern>
<pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#efe6cf"/><path d="M20,0 V20 M0,20 H20" stroke="#d9a49a" stroke-width=".8"/></pattern>
</defs><rect width="1024" height="600" fill="url(#bg)"/><!--SPILL-->`;
const GL=[],GLR=[];

// ---------- helpers
function scale(cx,cy,r,a0,sw,min,max,step,minor,o={}){let out='';const n=Math.round((max-min)/minor);
  for(let i=0;i<=n;i++){const v=min+i*minor,a=a0+sw*(v-min)/(max-min),k=(v-min)/step,maj=Math.abs(k-Math.round(k))<1e-6,red=o.red!=null&&v>=o.red-1e-9;
    const[x1,y1]=P(cx,cy,r,a),[x2,y2]=P(cx,cy,r-(maj?(o.ml||20):(o.nl||10)),a);
    out+=`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${red?C.red:(maj?(o.mc||C.tick||C.text):(o.nc||(C.tick?C.tick+'99':C.dim)))}" stroke-width="${maj?(o.mw||4):(o.nw||2)}" stroke-linecap="round"/>`;
    if(maj&&o.lab!==false){const[lx,ly]=P(cx,cy,r-(o.lr||44),a);out+=T(lx,ly+(o.ly||0),o.ls||30,o.fmt?o.fmt(v):v,{c:red?C.red:(o.lc||C.text),db:'central',f:o.lf||'B5'})}}
  return `<g filter="url(#bloom)">${out}</g>`+out}
function needle(cx,cy,r0,r1,a,col,w){const[x0,y0]=P(cx,cy,r0,a),[x1,y1]=P(cx,cy,r1,a);
  return `<line x1="${n1(x0)}" y1="${n1(y0)}" x2="${n1(x1)}" y2="${n1(y1)}" stroke="${col}" stroke-width="${w*3}" stroke-linecap="round" opacity=".45" filter="url(#glow)"/>`+
         `<line x1="${n1(x0)}" y1="${n1(y0)}" x2="${n1(x1)}" y2="${n1(y1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" filter="url(#nshadow)"/>`+`<line x1="${n1(x0)}" y1="${n1(y0)}" x2="${n1(x1)}" y2="${n1(y1)}" stroke="#fff" stroke-opacity=".55" stroke-width="${w*.3}" stroke-linecap="round"/>`}
function cneedle(cx,cy,r,a,col){const[tx,ty]=P(cx,cy,r,a),[bx1,by1]=P(cx,cy,7,a+90),[bx2,by2]=P(cx,cy,7,a-90),[tl,tly]=P(cx,cy,r*.18,a+180);
  return `<g filter="url(#nshadow)"><polygon points="${n1(tx)},${n1(ty)} ${n1(bx1)},${n1(by1)} ${n1(tl)},${n1(tly)}" fill="${col}"/><polygon points="${n1(tx)},${n1(ty)} ${n1(tl)},${n1(tly)} ${n1(bx2)},${n1(by2)}" fill="${col}"/><polygon points="${n1(tx)},${n1(ty)} ${n1(tl)},${n1(tly)} ${n1(bx2)},${n1(by2)}" fill="#000" fill-opacity=".35"/><line x1="${n1(tx)}" y1="${n1(ty)}" x2="${n1(tl)}" y2="${n1(tly)}" stroke="#fff" stroke-opacity=".45" stroke-width="1.2"/></g>`+
         `<circle cx="${cx}" cy="${cy}" r="${Math.max(12,r*.11)}" fill="url(#hub)" stroke="#000"/>`}
function bezel(cx,cy,r,w){return `<circle cx="${cx}" cy="${cy+6}" r="${r+w/2}" fill="none" stroke="#000" stroke-width="${w}" opacity=".7" filter="url(#bloom)"/>`+
  `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#chrome)" stroke-width="${w}"/>`+
  `<circle cx="${cx}" cy="${cy}" r="${r+w/2-1}" fill="none" stroke="url(#bevelHi)" stroke-width="1.6"/>`+
  `<circle cx="${cx}" cy="${cy}" r="${r-w/2+1.5}" fill="none" stroke="#000" stroke-width="3" stroke-opacity=".85"/>`}
function ring(cx,cy,r,w){GL.push([cx,cy,r-w/2]);const ri=r-w/2-5;
  const lit=TH=='premium'?`<path d="${arc(cx,cy,ri,25,155)}" stroke="${C.acc}" stroke-width="10" fill="none" opacity=".55" filter="url(#glow)"/><path d="${arc(cx,cy,ri,35,145)}" stroke="${C.acc}" stroke-width="2.5" fill="none" opacity=".8"/>`:'';
  return `<circle cx="${cx}" cy="${cy}" r="${r-w/2}" fill="url(#faceIn)"/>`+lit+bezel(cx,cy,r,w)}
function statusTop(o={}){return T(24,34,26,'10:10 PM',{a:'start',f:'B6'})+T(140,34,20,'Sun Nov 8',{a:'start',c:C.dim,f:'B5'})+
  T(948,34,26,'90°F',{a:'end'})+cog(990,26)}
function cog(x,y){let p='';for(let i=0;i<8;i++){const a=i*45;const[a1,b1]=P(x,y,13,a-10),[a2,b2]=P(x,y,13,a+10);p+=`<line x1="${n1(a1)}" y1="${n1(b1)}" x2="${n1(a2)}" y2="${n1(b2)}" stroke="${C.dim}" stroke-width="5"/>`}
  return p+`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="${C.dim}" stroke-width="4"/>`}
function dots(i){let o='';for(let k=0;k<4;k++)o+=`<rect x="${470+k*24}" y="584" width="${k==i?28:10}" height="6" rx="3" fill="${k==i?C.acc:C.faint}"/>`;return o}

// ================= PREMIUM =================
const pages={};
pages.premium_daily=()=>{
  // Tach wraps from the left dial into a bar across the top (0-1.5k on the dial, 1.5-5k on the bar).
  const LX=210,RX=814,CY=338,R=168,TY=CY-R,BAR0=LX,BAR1=RX-R*.62,ANG0=120,ANG1=270;
  const lin=v=>BAR0+(BAR1-BAR0)*(v-1.5)/3.5, ang=v=>ANG0+(ANG1-ANG0)*v/1.5;
  let o=statusTop();
  // track
  o+=`<path d="${arc(LX,CY,R,ANG0,ANG1)} L${BAR1},${TY}" fill="none" stroke="#132235" stroke-width="22"/>`;
  // red zone on the bar: vertical stripes 4.0-5.0
  for(let x=lin(4.0);x<=lin(5)+.1;x+=7)o+=`<line x1="${n1(x)}" y1="${TY-11}" x2="${n1(x)}" y2="${TY+11}" stroke="${C.red}" stroke-width="3.5"/>`;
  // fill to current rpm
  const r=V.rpm/1000;o+=`<path d="${arc(LX,CY,R,ANG0,ANG1)} L${n1(lin(r))},${TY}" fill="none" stroke="url(#blue)" stroke-width="22" opacity=".95"/>`;
  o+=`<line x1="${n1(lin(r))}" y1="${TY-18}" x2="${n1(lin(r))}" y2="${TY+18}" stroke="#fff" stroke-width="5" filter="url(#glow2)"/><line x1="${n1(lin(r))}" y1="${TY-18}" x2="${n1(lin(r))}" y2="${TY+18}" stroke="#fff" stroke-width="4"/>`;
  // labels
  [[0,ang(0)],[1,ang(1)]].forEach(([v,a])=>{const[x,y]=P(LX,CY,R-42,a);o+=T(x,y,34,v,{db:'central'});const[x1,y1]=P(LX,CY,R+11,a),[x2,y2]=P(LX,CY,R-14,a);o+=`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="#fff" stroke-width="3"/>`});
  [2,3,4,5].forEach(v=>{const x=lin(v);o+=T(x,TY-26,34,v,{c:v>=4?C.red:C.text});o+=`<line x1="${n1(x)}" y1="${TY-12}" x2="${n1(x)}" y2="${TY+12}" stroke="#fff" stroke-width="3"/>`});
  for(let v=1.5;v<5;v+=.5)if(v%1)o+=`<line x1="${n1(lin(v))}" y1="${TY-6}" x2="${n1(lin(v))}" y2="${TY+6}" stroke="${C.dim}" stroke-width="2"/>`;
  o+=T((lin(2)+lin(3))/2,TY-30,18,'RPM ×1000',{c:C.dim,f:'B5'});
  // left dial: gear
  o+=`<circle cx="${LX}" cy="${CY}" r="${R-26}" fill="url(#face)"/>`+ring(LX,CY,R-26,6);
  o+=T(LX,CY-70,22,'GEAR',{c:C.dim,ls:3,f:'B5'})+T(LX,CY+52,150,V.gear)+T(LX,CY+98,30,fmt(V.rpm)+' rpm',{c:C.dim,f:'B5'});
  // right dial: speedo
  o+=`<circle cx="${RX}" cy="${CY}" r="${R}" fill="url(#face)"/>`+ring(RX,CY,R+4,8);
  o+=scale(RX,CY,R-6,135,270,0,120,20,10,{ls:28,lr:42,ml:18,nl:9});
  o+=needle(RX,CY,R-118,R-8,135+270*V.mph/120,C.acc,5);
  o+=T(RX,CY+38,116,V.mph)+T(RX,CY+82,24,'MPH',{c:C.dim,ls:3,f:'B5'});
  // center card
  o+=`<rect x="400" y="212" width="224" height="300" rx="16" fill="url(#card)" stroke="#2a4260"/>`;
  o+=T(512,252,20,'BOOST',{c:C.dim,ls:3,f:'B5'})+T(512,318,72,V.boost.toFixed(1))+T(512,346,20,'psi',{c:C.dim,f:'B5'});
  o+=`<line x1="420" y1="366" x2="604" y2="366" stroke="#2a4260"/>`;
  o+=T(420,402,20,'TRANS',{a:'start',c:C.dim,ls:2,f:'B5'})+T(604,410,44,V.trans+'°',{a:'end'});
  o+=T(420,460,20,'MPG',{a:'start',c:C.dim,ls:2,f:'B5'})+T(604,470,44,V.inst.toFixed(1),{a:'end',c:C.green});
  // bottom strip
  o+=`<line x1="24" y1="540" x2="1000" y2="540" stroke="#1d3049"/>`;
  o+=T(28,578,22,'ODO',{a:'start',c:C.dim,f:'B5'})+T(80,580,32,fmt(V.odo)+' mi',{a:'start'});
  o+=T(512,580,32,'COOLANT  '+V.cool+'°',{});
  o+=T(996,580,32,Math.round(V.fuel*100)+'%  ·  '+V.range+' mi',{a:'end'})+T(800,578,22,'FUEL',{a:'end',c:C.dim,f:'B5'});
  return o+dots(0)};

pages.premium_sport=()=>{
  const CX=512,CY=318,R=250;let o='';
  o+=T(24,40,28,'10:10 PM',{a:'start'})+T(1000,40,28,'90°F',{a:'end'})+cog(990,80);
  // big tach: 0 at the bottom, clockwise, 60° per 1000 rpm
  const A0=90,SW=300,a=v=>A0+SW*v/5;
  o+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="url(#face)"/>`;
  {const[p0x,p0y]=P(CX,CY,R-10,a(4)),[p1x,p1y]=P(CX,CY,R-10,a(5)),[q1x,q1y]=P(CX,CY,R-120,a(5)),[q0x,q0y]=P(CX,CY,R-120,a(4));
   o+=`<radialGradient id="rz" gradientUnits="userSpaceOnUse" cx="${CX}" cy="${CY}" r="${R-10}"><stop offset=".5" stop-color="${C.red}" stop-opacity="0"/><stop offset="1" stop-color="${C.red}" stop-opacity=".7"/></radialGradient>`+
     `<path d="M${n1(p0x)},${n1(p0y)} A${R-10},${R-10} 0 0 1 ${n1(p1x)},${n1(p1y)} L${n1(q1x)},${n1(q1y)} A${R-120},${R-120} 0 0 0 ${n1(q0x)},${n1(q0y)} Z" fill="url(#rz)"/>`}
  o+=`<path d="${arc(CX,CY,R-14,a(4),a(5))}" stroke="${C.red}" stroke-width="10" fill="none"/>`;
  o+=ring(CX,CY,R+8,14);
  for(let v=0;v<=5;v+=.5){const[x1,y1]=P(CX,CY,R+20,a(v)),[x2,y2]=P(CX,CY,R+(v%1?28:38),a(v));o+=`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="#fff" stroke-width="${v%1?3:6}" stroke-linecap="round"/>`}
  o+=scale(CX,CY,R-6,A0,SW,0,5,1,.25,{ls:52,lr:62,ml:22,nl:10,red:4,lf:'B6'});
  o+=needle(CX,CY,92,R-16,a(V.rpm/1000),C.acc,7);
  o+=T(CX,CY-34,96,V.mph)+T(CX,CY-6,22,'MPH',{c:C.dim,ls:3,f:'B5'});
  o+=`<line x1="${CX-100}" y1="${CY+12}" x2="${CX+100}" y2="${CY+12}" stroke="#7d8da1" stroke-width="2"/>`;
  o+=T(CX-66,CY+92,40,'D',{c:C.faint})+T(CX,CY+104,100,V.gear);
  o+=T(CX,CY+146,26,fmt(V.rpm)+' rpm',{c:C.dim,f:'B5'})+T(CX+120,CY+196,18,'×1000 RPM',{c:C.dim,f:'B5'});
  // side arc bars, concentric with the tach
  const RR=468;
  function side(a0,a1,frac,lab,val,unit,redFrac,left,top){let g='';
    g+=`<path d="${arc(CX,CY,RR,a0,a1)}" stroke="#1a283a" stroke-width="18" fill="none"/>`;
    const af=a0+(a1-a0)*frac;g+=`<path d="${arc(CX,CY,RR,a0,af)}" stroke="${frac>=redFrac?C.red:'#dfe6ee'}" stroke-width="18" fill="none"/>`;
    const[rx1,ry1]=P(CX,CY,RR-14,a0+(a1-a0)*redFrac),[rx2,ry2]=P(CX,CY,RR+14,a0+(a1-a0)*redFrac);g+=`<line x1="${n1(rx1)}" y1="${n1(ry1)}" x2="${n1(rx2)}" y2="${n1(ry2)}" stroke="${C.red}" stroke-width="4"/>`;
    const x=left?156:868,y=top?200:470;
    g+=T(x,y-44,20,lab,{c:C.dim,ls:2,f:'B5'})+T(x,y+6,54,val,{})+T(x,y+34,20,unit,{c:C.dim,f:'B5'});return g}
  o+=side(218,194,(V.cool-100)/160,'COOLANT',V.cool+'°','°F',(230-100)/160,true,true);
  o+=side(146,168,(V.trans-100)/180,'TRANS',V.trans+'°','°F',(230-100)/180,true,false);
  o+=side(322,346,V.boost/40,'BOOST',V.boost.toFixed(1),'psi',35/40,false,true);

       `<path d="M${cap},${y-5} H${fx+(left?8:-8)} Q${fx},${y-5} ${fx},${y+3} V${y+h-3} Q${fx},${y+h+5} ${fx+(left?8:-8)},${y+h+5} H${cap}" fill="none" stroke="#e9f1f8" stroke-width="2.5" stroke-linecap="round"/>`;

  const L=[['INTAKE',V.iat,'°F',[0,200,150,70,118]],['TRANS',V.trans,'°F',[100,280,230,150,212]],['COOLANT',V.cool,'°F',[100,260,230,180,204]],['OIL',V.oil,'°F',[100,300,260,190,221]]];
