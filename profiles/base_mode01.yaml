# Universal OBD-II base: SAE J1979 Mode 01 PIDs plus adapter voltage.
# Values are in native ECU units; GaugeWorks converts for display.
# Formula bytes: A = first data byte after the echoed PID.
# Vehicle profiles `extends: base_mode01` and add or override entries.

id: base_mode01
name: Universal OBD-II (Mode 01)

pids:
  battery:
    short: Battery
    name: Battery voltage (adapter)
    service: AT          # adapter-local read (ATRV), never touches the bus
    pid: RV
    header: "7DF"
    formula: "A"         # parsed specially by the poller
    units: V
    min: 0
    max: 16
    poll_rate: slow
    verified: true
    source: OBDLink/ELM327 datasheet (ATRV)

  mil:
    short: CEL
    name: Check engine light (1 = on)
    service: "01"
    pid: "01"
    header: "7DF"
    formula: "A>>7"
    units: ""
    min: 0
    max: 1
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 01

  dtc_count:
    short: DTCs
    name: Stored DTC count
    service: "01"
    pid: "01"
    header: "7DF"
    formula: "A&127"
    units: ""
    min: 0
    max: 127
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 01

  load:
    short: Load
    name: Engine load
    service: "01"
    pid: "04"
    header: "7DF"
    formula: "A*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 04

  coolant:
    short: Coolant
    name: Coolant temp
    service: "01"
    pid: "05"
    header: "7DF"
    formula: "A-40"
    units: "°C"
    min: -40
    max: 130
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 05

  map:
    short: MAP
    name: Intake manifold pressure (abs)
    service: "01"
    pid: "0B"
    header: "7DF"
    formula: "A"
    units: kPaa
    min: 0
    max: 255
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 0B
    notes: Caps at 255 kPa (~22 psi boost). Diesels need 0187 or Mode 22 for full range.

  rpm:
    short: RPM
    name: Engine RPM
    service: "01"
    pid: "0C"
    header: "7DF"
    formula: "((A*256)+B)/4"
    units: rpm
    min: 0
    max: 8000
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 0C

  speed:
    short: Speed
    name: Vehicle speed
    service: "01"
    pid: "0D"
    header: "7DF"
    formula: "A"
    units: km/h
    min: 0
    max: 255
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 0D

  iat:
    short: IAT
    name: Intake air temp
    service: "01"
    pid: "0F"
    header: "7DF"
    formula: "A-40"
    units: "°C"
    min: -40
    max: 215
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 0F

  maf:
    short: MAF
    name: MAF air flow
    service: "01"
    pid: "10"
    header: "7DF"
    formula: "((A*256)+B)/100"
    units: g/s
    min: 0
    max: 655
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 10

  run_time:
    short: Run time
    name: Run time since start
    service: "01"
    pid: "1F"
    header: "7DF"
    formula: "(A*256)+B"
    units: s
    min: 0
    max: 65535
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 1F

  fuel_level:
    short: Fuel
    name: Fuel level
    service: "01"
    pid: "2F"
    header: "7DF"
    formula: "A*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 2F

  boost:
    short: Boost
    name: Boost (gauge)
    derived: "map - baro"
    units: kPag
    min: -20
    max: 300
    poll_rate: fast
    verified: false
    source: Derived; MAP (PID 0B) minus baro (PID 33)
    notes: PID 0B caps at 255 kPa abs (~22 psig). Profiles can override with a wide-range MAP.

  baro:
    short: Baro
    name: Barometric pressure
    service: "01"
    pid: "33"
    header: "7DF"
    formula: "A"
    units: kPaa
    min: 0
    max: 255
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 33

  ambient:
    short: Outside
    name: Ambient air temp
    service: "01"
    pid: "46"
    header: "7DF"
    formula: "A-40"
    units: "°C"
    min: -40
    max: 215
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 46

  oil_temp_std:
    short: Oil
    name: Engine oil temp (std)
    service: "01"
    pid: "5C"
    header: "7DF"
    formula: "A-40"
    units: "°C"
    min: -40
    max: 210
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 5C

  fuel_rate:
    short: Fuel rate
    name: Engine fuel rate
    service: "01"
    pid: "5E"
    header: "7DF"
    formula: "((A*256)+B)/20"
    units: L/h
    min: 0
    max: 3276
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 5E
    notes: Often unsupported on older diesels; check supported-PID list.

  # ---- More standard PIDs for the Diagnostic page (read in the background) ----
  dist_mil:
    short: Dist MIL
    name: Distance with check engine light on
    service: "01"
    pid: "21"
    header: "7DF"
    formula: "(A*256)+B"
    units: km
    min: 0
    max: 65535
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 21

  warmups:
    short: Warmups
    name: Warm-ups since codes cleared
    service: "01"
    pid: "30"
    header: "7DF"
    formula: "A"
    units: ""
    min: 0
    max: 255
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 30

  dist_clear:
    short: Dist clr
    name: Distance since codes cleared
    service: "01"
    pid: "31"
    header: "7DF"
    formula: "(A*256)+B"
    units: km
    min: 0
    max: 65535
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 31

  ecu_volts:
    short: ECU volts
    name: Control module voltage
    service: "01"
    pid: "42"
    header: "7DF"
    formula: "((A*256)+B)/1000"
    units: V
    min: 0
    max: 20
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 42

  pedal_d:
    short: Pedal
    name: Accelerator pedal position D
    service: "01"
    pid: "49"
    header: "7DF"
    formula: "A*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 49

  pedal_e:
    short: Pedal E
    name: Accelerator pedal position E
    service: "01"
    pid: "4A"
    header: "7DF"
    formula: "A*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 4A

  inj_timing:
    short: Inj timing
    name: Fuel injection timing
    service: "01"
    pid: "5D"
    header: "7DF"
    formula: "((A*256)+B)/128-210"
    units: "°"
    min: -210
    max: 302
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 5D
    notes: Degrees relative to TDC (negative = before TDC).

  torque_demand:
    short: Trq demand
    name: Driver demand engine torque
    service: "01"
    pid: "61"
    header: "7DF"
    formula: "A-125"
    units: "%"
    min: -125
    max: 130
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 61

  torque_actual:
    short: Torque %
    name: Actual engine torque
    service: "01"
    pid: "62"
    header: "7DF"
    formula: "A-125"
    units: "%"
    min: -125
    max: 130
    poll_rate: fast
    verified: true
    source: SAE J1979 PID 62

  torque_ref:
    short: Trq ref
    name: Engine reference torque
    service: "01"
    pid: "63"
    header: "7DF"
    formula: "(A*256)+B"
    units: Nm
    min: 0
    max: 65535
    poll_rate: once
    verified: true
    source: SAE J1979 PID 63

  friction_torque:
    short: Friction
    name: Engine friction torque
    service: "01"
    pid: "8E"
    header: "7DF"
    formula: "A-125"
    units: "%"
    min: -125
    max: 130
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 8E

  exhaust_press:
    short: Exh press
    name: Exhaust back-pressure (bank 1)
    service: "01"
    pid: "73"
    header: "7DF"
    formula: "((B*256)+C)/100"
    units: kPaa
    min: 0
    max: 655
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 73

  egr_temp:
    short: EGR temp
    name: EGR temperature
    service: "01"
    pid: "6B"
    header: "7DF"
    formula: "B-40"
    units: "°C"
    min: -40
    max: 215
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 6B

  maf_sensor:
    short: MAF A
    name: Mass air flow sensor A
    service: "01"
    pid: "66"
    header: "7DF"
    formula: "((B*256)+C)/32"
    units: g/s
    min: 0
    max: 2048
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 66

  iat_sensor:
    short: IAT 1
    name: Intake air temp sensor (bank 1)
    service: "01"
    pid: "68"
    header: "7DF"
    formula: "B-40"
    units: "°C"
    min: -40
    max: 215
    poll_rate: slow
    verified: true
    source: SAE J1979 PID 68

layouts:
  status: [rpm, speed, coolant, ambient, fuel_level, mil, dtc_count, battery, map, baro, load]

# GaugeWorks. `display`: per-channel gauge settings in IMPERIAL display units
# (metric mode converts). Any slot showing that channel uses them; channels
# without an entry get automatic ranges. warn/alarm = value at or above.
# `pages`: swipeable screens built from templates (dash, quad, economy, list).
# Slots and tiles can be changed on the screen by tapping them.
gaugeworks:
  display:
    rpm:          {min: 0, max: 7000, major: 1000, minor: 5, label: RPM, scale: 0.001, scale_label: "x1000", warn: 6000, alarm: 6500}
    speed:        {min: 0, max: 140, major: 20, minor: 4, label: SPEED}
    boost:        {min: 0, max: 30, major: 5, minor: 5, label: BOOST}
    map:          {min: 0, max: 40, major: 5, minor: 5, label: MAP}
    coolant:      {min: 100, max: 260, major: 40, minor: 4, label: COOLANT, warn: 225, alarm: 240}
    iat:          {min: 0, max: 200, major: 50, minor: 5, label: IAT}
    oil_temp_std: {min: 100, max: 300, major: 50, minor: 5, label: OIL, warn: 250, alarm: 270}
    fuel_level:   {min: 0, max: 100, major: 25, minor: 5, label: FUEL}
    battery:      {min: 10, max: 16, major: 1, minor: 5, label: VOLTS}
    load:         {min: 0, max: 100, major: 20, minor: 4, label: LOAD}
  pages:
    - name: Daily
      template: dash
      slots: {left: speed, center: rpm, right: boost, small1: coolant, small2: iat}
      tiles: [econ_inst, econ_tank, econ_trip, econ_last, ambient, fuel_level, battery, trip_dist]
    - name: Economy
      template: economy
      slots: {gauge: fuel_level}
      tiles: [econ_inst, econ_tank, econ_trip, econ_last]
    - name: Diagnostic
      template: list
