# 2014 Ford F-250 6.7L Power Stroke (6R140 automatic).
# JP's truck is off-road with DEF/SCR and EGR cooler removed and a tune; some
# emissions PIDs report fixed placeholder values. See notes per PID.
# Every Mode 22 entry is verified: false until JP confirms it against FORScan
# or the dash. Sources are from ford-trucks.com / thedieselstop.com Torque Pro
# lists; see docs/pid-research.md. Values are in native units (°C, kPa, km).
#
# Pattern seen on the 6.7 PCM: DID F4xx returns the same layout as Mode 01 PID
# xx (byte A = support bits, data starts at B). Entries marked "F4xx mirror"
# are derived from that pattern, not from a 6.7-specific post.

id: ford_f250_67_2014
name: 2014 Ford F-250 6.7L Powerstroke
extends: base_mode01

match:
  wmi: ["1FT"]
  year: "E"        # VIN position 10: 2014
  engine: "T"      # VIN position 8: 6.7L diesel (unverified)

# Mode 01 goes to the PCM directly (7E0) with a response count, not broadcast:
# broadcast on this truck gave intermittent NO DATA (several modules answer).
obd_header: "7E0"

headers:
  pcm: "7E0"
  tcm: "7E1"
  ipc: "720"

shift:
  enabled: false   # automatic; warning states handle EGT/coolant/trans instead
  rpm: 3000

pids:
  # ---- Phase 0: confirmable on the dash --------------------------------
  odometer:
    short: Odometer
    name: Odometer (IPC)
    service: "22"
    pid: "404C"
    header: "720"
    formula: "((A*65536)+(B*256)+C)/10"
    units: km
    min: 0
    max: 1600000
    poll_rate: once
    verified: true
    source: https://www.ford-trucks.com/forums/1322804-torque-pro-ford-6-7l-extended-pids-37.html
    notes: Verified 2026-11-07. Reads 148,200.5 mi vs dash 148,197 (+3.5 mi module vs cluster).

  odometer_dd01:
    short: Odo DD01
    name: Odometer (PCM DD01, fallback)
    service: "22"
    pid: "DD01"
    header: "7E0"
    formula: "(A*65536)+(B*256)+C"
    units: km
    min: 0
    max: 16000000
    poll_rate: once
    verified: false
    source: Generic Ford DID convention; answered on JP's truck 2026-11-07
    notes: Integer km. Matched 404C within 0.4 mi (148,200.1 vs 148,200.5).

  trans_temp:
    short: Trans
    name: Trans fluid temp (TCM)
    service: "22"
    pid: "1E1C"
    header: "7E1"
    formula: "((signed(A)*256)+B)/16"
    units: "°C"
    min: -40
    max: 150
    poll_rate: slow
    verified: false
    source: https://www.ford-trucks.com/forums/1319750-pids-and-calibrations-for-torque-pro.html
    notes: Compare to the cluster trans temp gauge. Some lists use header 7E0.

  trans_temp_pcm:
    short: Trans PCM
    name: Trans fluid temp (via PCM)
    service: "22"
    pid: "1E1C"
    header: "7E0"
    formula: "((signed(A)*256)+B)/16"
    units: "°C"
    min: -40
    max: 150
    poll_rate: slow
    verified: false
    source: Same as trans_temp, alternate header
    notes: Fallback if 7E1 doesn't answer.

  engine_hours:
    short: Eng hours
    name: Engine hours (total run time)
    service: "01"
    pid: "7F"
    header: "7DF"
    formula: "((B*16777216)+(C*65536)+(D*256)+E)/3600"
    units: h
    min: 0
    max: 100000
    poll_rate: once
    verified: false
    source: SAE J1979 PID 7F layout; no 6.7 source found
    notes: "Reads ~309 h on JP's truck (148k mi), counting up. Likely reset by PCM flash/tune; compare FORScan."

  # ---- Phase 1 candidates ----------------------------------------------
  # ---- Standard SAE extended PIDs this truck advertises -----------------
  # 2026-11-07 truck bitmap (key on, engine off) lists 67 71 77 78 5C 5E 6D 87
  # 8B 85, so these replace the F4xx mirror guesses. Scaling is per SAE J1979,
  # but byte layouts stay verified: false until confirmed on a drive.
  coolant:
    short: Coolant
    name: Coolant temp (sensor 1)
    service: "01"
    pid: "67"
    header: "7DF"
    formula: "B-40"
    units: "°C"
    min: -40
    max: 130
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 67; truck lacks PID 05 (bitmap 2026-11-07)
    notes: "Live engine coolant: 26 C at start, climbed 51->60 C over ~10 min idle (2026-11-07)."

  coolant2:
    short: Coolant2
    name: Coolant temp (sensor 2)
    service: "01"
    pid: "67"
    header: "7DF"
    formula: "C-40"
    units: "°C"
    min: -40
    max: 130
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 67 sensor 2
    notes: "Fixed at 65.0 C on every read (2026-11-07) - placeholder on JP's tuned truck?"

  map_wide:
    short: MAP
    name: MAP abs (wide range)
    service: "01"
    pid: "87"
    header: "7DF"
    formula: "((B*256)+C)/32"
    units: kPaa
    min: 0
    max: 400
    poll_rate: fast
    verified: false
    source: SAE J1979 PID 87; key-on read 97.9 kPa = baro (2026-11-07)
    notes: Boost = map_wide - baro. Truck lacks PID 0B.

  boost:
    short: Boost
    name: Boost (gauge)
    derived: "map_wide - baro"
    units: kPag
    min: -20
    max: 300
    poll_rate: fast
    verified: false
    source: Derived; MAP abs (PID 87) minus baro (PID 33)
    notes: "Idle 2026-11-07: ~0.4 psig at 600 rpm, ~1.1 psig at 1545 rpm (from MAP/baro reads)."

  vgt_dev:
    short: VGT dev
    name: VGT deviation (actual - desired)
    derived: "vgt_actual - vgt_desired"
    units: "%"
    min: -100
    max: 100
    poll_rate: fast
    verified: false
    source: Derived from PID 71
    notes: Logged so mismatches show up in drive logs. Semantics of 71 B/C unverified.

  vgt_desired:
    short: VGT des
    name: VGT vane commanded
    service: "01"
    pid: "71"
    header: "7DF"
    formula: "B*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: fast
    verified: false
    source: SAE J1979 PID 71 (VGT A commanded); same bytes seen via 22F471
    notes: "Position tracks RPM (52% @600, 41% @920, 28% @1545, 2026-11-07). Cmd/pos meaning: check FORScan."

  vgt_actual:
    short: VGT act
    name: VGT vane position
    service: "01"
    pid: "71"
    header: "7DF"
    formula: "C*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: fast
    verified: false
    source: SAE J1979 PID 71 (VGT A position)

  cact:
    short: CAC temp
    name: Charge air cooler outlet temp
    service: "01"
    pid: "77"
    header: "7DF"
    formula: "B-40"
    units: "°C"
    min: -40
    max: 215
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 77 (bank 1 sensor 1)

  egt11:
    short: EGT11
    name: EGT11 (post-turbo)
    service: "01"
    pid: "78"
    header: "7DF"
    formula: "((B*256)+C)/10-40"
    units: "°C"
    min: -40
    max: 1000
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 78 sensor 1; Ford naming per thedieselstop 6.7 list
    notes: "Fixed 0 C (raw 0190) on every read 2026-11-07; sensors 3/4 fixed 450 C. Placeholders? Check what's installed."

  egt12:
    short: EGT12
    name: EGT12 (post-DOC)
    service: "01"
    pid: "78"
    header: "7DF"
    formula: "((D*256)+E)/10-40"
    units: "°C"
    min: -40
    max: 1000
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 78 sensor 2

  egt13:
    short: EGT13
    name: EGT13 (pre-DPF)
    service: "01"
    pid: "78"
    header: "7DF"
    formula: "((F*256)+G)/10-40"
    units: "°C"
    min: -40
    max: 1000
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 78 sensor 3

  egt14:
    short: EGT14
    name: EGT14 (post-DPF)
    service: "01"
    pid: "78"
    header: "7DF"
    formula: "((H*256)+I)/10-40"
    units: "°C"
    min: -40
    max: 1000
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 78 sensor 4

  rail_desired:
    short: Rail des
    name: Fuel rail pressure commanded
    service: "01"
    pid: "6D"
    header: "7DF"
    formula: "((B*256)+C)/10"
    units: barg
    min: 0
    max: 2200
    poll_rate: fast
    verified: false
    source: SAE J1979 PID 6D; 22F46D key-on read 300 bar desired (2026-11-07)

  rail_actual:
    short: Rail act
    name: Fuel rail pressure actual
    service: "01"
    pid: "6D"
    header: "7DF"
    formula: "((D*256)+E)/10"
    units: barg
    min: 0
    max: 2200
    poll_rate: fast
    verified: false
    source: SAE J1979 PID 6D; 22F46D key-on read 6 bar (lift pump) (2026-11-07)

  regen_active:
    short: Regen
    name: DPF regen in progress
    service: "01"
    pid: "8B"
    header: "7DF"
    formula: "B&1"
    units: ""
    min: 0
    max: 1
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 8B byte B bit 0

  def_level:
    short: DEF
    name: DEF tank level
    service: "01"
    pid: "85"
    header: "7DF"
    formula: "F*100/255"
    units: "%"
    min: 0
    max: 100
    poll_rate: slow
    verified: false
    source: SAE J1979 PID 85 (NOx reagent system) byte F, from memory
    notes: "N/A on JP's truck: DEF system removed (off-road). Read 0% 2026-11-07. Kept for other 6.7s."

  # ---- Ford Mode 22 -------------------------------------------------------
  soot_mass:
    short: Soot
    name: DPF soot load
    service: "22"
    pid: "042C"
    header: "7E0"
    formula: "((A*256)+B)*100/65535"
    units: g/L
    min: 0
    max: 100
    poll_rate: slow
    verified: false
    source: https://www.thedieselstop.com/threads/torque-pro-app-ford-6-7l-extended-pids.446986/
    notes: Answered 1.9 g/L key-on (2026-11-07).

layouts:
  status: [rpm, speed, boost, coolant, trans_temp, odometer, fuel_level, ambient, battery, engine_hours,
           map_wide, baro, egt11, vgt_desired, vgt_actual, vgt_dev, rail_actual, fuel_rate, regen_active, soot_mass,
           mil, dtc_count]

gaugeworks:
  gauges:
    tach:    {key: rpm, min: 0, max: 5000, major: 1000, minor: 4, label: RPM, scale: 0.001, scale_label: "x1000", warn: 3800, alarm: 4100}
    speed:   {key: speed, min: 0, max: 120, major: 20, minor: 4, label: SPEED}
    boost:   {key: boost, min: 0, max: 40, major: 5, minor: 5, label: BOOST, warn: 33, alarm: 38}
    coolant: {key: coolant, min: 100, max: 260, major: 40, minor: 4, label: COOLANT, warn: 225, alarm: 235}
    trans:   {key: trans_temp, min: 100, max: 260, major: 40, minor: 4, label: TRANS, warn: 220, alarm: 240}
    vgt:     {desired: vgt_desired, actual: vgt_actual, label: VGT}
  tiles: [econ_inst, econ_avg, ambient, oil_temp_std, battery, fuel_level, mil, trip_dist]

