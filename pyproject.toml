[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jpcan"
version = "0.1.0"
description = "Read-only OBD2/CAN gauge and logging system. JpCAN reads it. GaugeWorks shows it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "windows-curses>=2.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
jpcan = "core.cli:main"

[tool.setuptools]
packages = ["core", "gaugeworks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
